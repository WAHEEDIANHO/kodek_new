<div class="grid md:grid-cols-3 gap-6 max-w-6xl mx-auto px-6">

    @for (f of features; track $index) {
    <div class="bg-white shadow-lg rounded-xl  text-center border border-gray-100 feature_card" >
    <div class="flex">
      <span class="w-5 h-5 bg-green-500 rounded-full border-4 border-white shadow outline outline-green-500 m-3"></span>
    </div>
    <p class="text-gray-800 font-medium text-2xl px-6 text-center">
      {{ f.title }}
    </p>
  </div>
    }
</div>
