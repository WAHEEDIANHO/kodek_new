<section class="relative min-h-screen w-full overflow-hidden flex flex-col justify-center py-[var(--spacing-fluid-py)]">
  
  <!-- Hero Section Background -->
  <div class="hero-bg-overlay absolute inset-0 -z-20" aria-hidden="true"></div>

  <!-- Decorative Background Image - Hidden on small screens to reduce clutter -->
  <div class="absolute top-[10vh] right-0 w-[5rem] md:w-[7rem] opacity-30 md:opacity-100 select-none pointer-events-none" aria-hidden="true">
    <img src="/images/about/ab_dot.png" alt="" class="w-full h-auto">
  </div>

  <div class="container mx-auto px-4 md:px-8 lg:px-12">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12 lg:gap-16 items-center">

      <!-- LEFT SIDE TEXT: Mobile-first ordering (comes first in DOM) -->
      <div class="order-2 lg:order-1 text-center lg:text-left">
        <app-hero-heading />
      </div>

      <!-- RIGHT SIDE IMAGE: Appears above text on mobile for visual impact -->
      <div class="order-1 lg:order-2 flex justify-center lg:justify-end">
        <app-hero-image />
      </div>

    </div>
  </div>

  <!-- FEATURES BELOW: Positioned relative to content flow on small screens, absolute on large -->
  <div class="mt-12 lg:mt-16 w-full lg:absolute lg:bottom-8 xl:bottom-12">
    <div class="container mx-auto px-4">
      <app-hero-feature />
    </div>
  </div>

</section>
