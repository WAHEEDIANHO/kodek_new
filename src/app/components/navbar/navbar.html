<nav class="absolute inset-x-0 top-0 z-50 w-full bg-white">
  <div class="w-full px-8 lg:px-12">
    <div class="flex items-center justify-between h-20">

      <div class="flex items-center shrink-0">
        <img src="images/home/logo.png" alt="Kodek Innovations" class="h-16 w-auto" />
      </div>

      <div class="hidden md:flex items-center space-x-10 text-gray-700 text-lg font-medium">
        <a routerLink="/" class="hover:text-green-600 cursor-pointer hover:font-bold">Home</a>
        <a routerLink="/about" class="hover:text-green-600 hover:font-bold">About</a>
        <div class="relative">
          <button
            type="button"
            class="inline-flex items-center gap-2 px-4 py-1 rounded-full text-gray-800 hover:text-green-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-green-600 cursor-pointer"
            aria-haspopup="true"
            [attr.aria-expanded]="offerOpen()"
            aria-controls="offer-menu"
            (click)="toggleOffer()"
            (keydown)="onOfferButtonKeydown($event)"
          >
            <span class="font-medium hover:font-bold">What we Offer</span>
            <span
              class="offer-toggle-icon bg-green-600"
              [class.offer-toggle-icon-open]="offerOpen()"
              aria-hidden="true"
            >
              <svg
                class="w-3 h-3"
                viewBox="0 0 12 12"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M3 7.5L6 4.5L9 7.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
        </div>
        <a routerLink="/contact" class="hover:text-green-600 cursor-pointer hover:font-bold">Contact</a>
      </div>

      <div class="hidden md:flex">
        <a
          routerLink="/book-demo"
          class="px-6 py-2 rounded-full text-white font-semibold
                 bg-linear-to-r from-green-700 via-green-600 to-green-700
                 hover:opacity-90 transition">
          Book a Demo
        </a>
      </div>

      <button
        (click)="toggleMobile()"
        class="md:hidden text-gray-800 focus:outline-none"
      >
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

    </div>

    @if (offerOpen()) {
      <div
        id="offer-menu"
        class="hidden md:block"
        role="menu"
        aria-label="What we offer"
      >
          <!-- <div class="max-w-6xl mx-auto"> -->

            <div class="w-full bg-white rounded-3xl shadow-xl px-12 py-10">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-x-12 gap-y-10">
                <button
                  type="button"
                  class="offer-card"
                  role="menuitem"
                  data-offer-menu-item
                  (keydown)="onOfferItemKeydown($event, 0)"
                >
                  <div class="offer-card-icon  border bg-[#D4EBF7]">
                    <img src="/images/navbar/ds.svg" alt="Digital Solution" class="object-cover">
                  </div>
                  <div class="text-left">
                    <div class="offer-card-title offer-card-title-blue">
                      Digital Solution
                    </div>
                    <p class="offer-card-body">
                      From mobile and web apps to AI and enterprise solutions, we build
                      high-performing digital products that deliver measurable results.
                    </p>
                  </div>
                </button>

                <button
                  type="button"
                  class="offer-card"
                  role="menuitem"
                  data-offer-menu-item
                  (keydown)="onOfferItemKeydown($event, 1)"
                >
                  <div class="offer-card-icon border bg-[#EAF8E6]">
                    <img src="/images/navbar/cl.svg" alt="Central LMS" class="object-cover">
                  </div>
                  <div class="text-left">
                    <div class="offer-card-title offer-card-title-green">
                      Central LMS
                    </div>
                    <p class="offer-card-body">
                      Develop employees&apos; skills and boost performance with
                      always-on access to curated learning resources.
                    </p>
                  </div>
                </button>

                <button
                  type="button"
                  class="offer-card"
                  role="menuitem"
                  data-offer-menu-item
                  (keydown)="onOfferItemKeydown($event, 2)"
                >
                  <div class="offer-card-icon border bg-[#57DB924D]">
                    <img src="/images/navbar/learno.svg" alt="Learn - O&apos; Centric" class="object-cover">
                  </div>
                  <div class="text-left">
                    <div class="offer-card-title offer-card-title-lightgreen">
                      Learn - O&apos; Centric
                    </div>
                    <p class="offer-card-body">
                      Join us in shaping the future with a comprehensive and innovative
                      school learning management platform.
                    </p>
                  </div>
                </button>

                <button
                  type="button"
                  class="offer-card"
                  role="menuitem"
                  data-offer-menu-item
                  (keydown)="onOfferItemKeydown($event, 3)"
                >
                  <div class="offer-card-icon border bg-[#57DB924D] px-2">
                    <img src="/images/navbar/content.svg" alt="Content Conversion" class="object-cover">
                  </div>
                  <div class="text-left">
                    <div class="offer-card-title offer-card-title-teal">
                      Content Conversion
                    </div>
                    <p class="offer-card-body">
                      We create high-impact, cost-effective eLearning content to engage
                      learners and improve business performance.
                    </p>
                  </div>
                </button>

                <button
                  type="button"
                  class="offer-card"
                  role="menuitem"
                  data-offer-menu-item
                  (keydown)="onOfferItemKeydown($event, 4)"
                >
                  <div class="offer-card-icon border bg-[#000000] px-2">
                    <img src="/images/navbar/mf.svg" alt="Marketing &amp; Finance" class="object-cover">
                  </div>
                  <div class="text-left">
                    <div class="offer-card-title offer-card-title-dark">
                      Event Management
                    </div>
                    <p class="offer-card-body">
                      We help promote your events and make them more discoverable through
                      targeted and sponsored campaigns.
                    </p>
                  </div>
                </button>
              </div>
            </div>
          <!-- </div> -->
      </div>
    }

    <div
      class="md:hidden pb-4 space-y-3 text-center text-gray-700 font-medium"
      [class.hidden]="!mobileOpen()"
    >
      <a routerLink="/" class="block py-2 hover:text-green-600">Home</a>
      <a routerLink="/about" class="block py-2 hover:text-green-600">About</a>
      <a routerLink="/services" class="block py-2 hover:text-green-600">What we Offer</a>
      <a routerLink="/contact" class="block py-2 hover:text-green-600">Contact</a>

      <a
        routerLink="/book-demo"
        class="inline-block mt-2 px-6 py-2 rounded-full text-white font-semibold
               kodek-success
               hover:opacity-90 transition">
        Book a Demo
      </a>
    </div>
  </div>
</nav>
